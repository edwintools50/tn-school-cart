<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — TN School Cart</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f9fc;
    color: #14213d;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 360px; }
  img { width: 72px; height: 72px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #5b6b82; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #145c9e; color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0e1420; color: #eef2f7; }
    p { color: #97a3b6; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon.png" alt="TN School Cart">
    <h1>You're offline</h1>
    <p>Check your internet connection. TN School Cart needs a connection to load the marketplace, orders, and messages.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
