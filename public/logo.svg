  <line x1="104" y1="62" x2="132" y2="62" stroke="#2f6fb3" stroke-width="2"/>
  <line x1="106" y1="54" x2="130" y2="54" stroke="#2f6fb3" stroke-width="1.5"/>
  <line x1="106" y1="70" x2="130" y2="70" stroke="#2f6fb3" stroke-width="1.5"/>

